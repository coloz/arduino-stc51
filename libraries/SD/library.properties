sentence=Limited FAT16/FAT32 root-file access for C and C++ arduino-stc51 profiles.
paragraph=Initializes SDSC and SDHC cards over software SPI and reads, creates, appends, overwrites, flushes, and removes ASCII short 8.3 files in the FAT16/FAT32 root directory. It uses one 512-byte XDATA cache, one card, and one active file. The clean-room C API and experimental File/SDClass facade do not support subdirectories, directory iteration, long names, FAT12, exFAT, or power-loss atomicity.
