sentence=Software I2C master for C and C++ arduino-stc51 profiles.
paragraph=Provides a bit-banged I2C master with configurable pins, clock rate, repeated starts, clock-stretch timeout handling, and separate 32-byte TX/RX buffers by default. The C++ profile exposes an Arduino-shaped TwoWire wrapper over the same C HAL. Slave mode and onReceive/onRequest callbacks are not supported (WIRE_HAS_SLAVE=0).
