sentence=I2C master with STC32G hardware support and portable software fallback.
paragraph=Provides an I2C master with hardware support on audited STC32G variants (SDA=P3.3/SCL=P3.2) and software fallback with configurable pins, clock rate, repeated starts, clock-stretch timeout handling, and separate 32-byte TX/RX buffers by default. The C++ profile exposes an Arduino-shaped TwoWire wrapper over the same C HAL. Slave mode and onReceive/onRequest callbacks are not supported (WIRE_HAS_SLAVE=0).
category=Communication
