sentence=Software SPI master for C and C++ arduino-stc51 profiles.
paragraph=Provides a portable bit-banged SPI master with configurable pins, clock, bit order, and modes 0 through 3. The C++ profile exposes Arduino-shaped SPISettings and SPIClass wrappers over the same C HAL. There is no hardware SPI, slave mode, DMA, or transfer-complete interrupt; the sketch controls chip select.
