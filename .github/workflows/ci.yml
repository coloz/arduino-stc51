name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate-and-compile:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Validate generated metadata
        shell: pwsh
        run: |
          $Package = ./scripts/package-platform.ps1 -Version 0.0.2
          $Package | Out-Host
          "STC_PLATFORM_ARCHIVE=$($Package.path)" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          node tools/variants/generate.mjs --check
          if ($LASTEXITCODE -ne 0) { throw 'Generated metadata is out of date' }

      - name: Upload verified platform package
        uses: actions/upload-artifact@v4
        with:
          name: arduino-stc51-platform-0.0.2
          path: ${{ env.STC_PLATFORM_ARCHIVE }}
          if-no-files-found: error
          retention-days: 7

      - name: Stage verified toolchain and platform
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Work = Join-Path $env:RUNNER_TEMP 'arduino-stc51-ci'
          $Data = Join-Path $Work 'data'
          $Platform = Join-Path $Data 'packages/arduino-stc51/hardware/mcs51/0.0.2'
          $Downloads = Join-Path $Work 'downloads'
          $Extract = Join-Path $Work 'extract'
          New-Item -ItemType Directory -Force -Path $Platform,$Downloads,$Extract,$Data | Out-Null

          $PlatformExtract = Join-Path $Extract 'platform'
          New-Item -ItemType Directory -Force -Path $PlatformExtract | Out-Null
          tar -xjf $env:STC_PLATFORM_ARCHIVE -C $PlatformExtract
          if ($LASTEXITCODE -ne 0) { throw 'Platform archive extraction failed' }
          Copy-Item -Recurse -Force "$PlatformExtract/arduino-stc51-0.0.2/*" -Destination $Platform

          $Manifest = Get-Content -Raw -Encoding UTF8 tools/toolchain-manifest.json | ConvertFrom-Json
          foreach ($Tool in $Manifest.tools) {
            $System = @($Tool.systems | Where-Object { $_.host -match 'mingw32$' })[0]
            if ($null -eq $System) { throw "No Windows system for $($Tool.id)" }
            $Archive = Join-Path $Downloads $System.archiveFileName
            $LocalArchive = Join-Path $PWD "dist/$($System.archiveFileName)"
            if (Test-Path -LiteralPath $LocalArchive) {
              Copy-Item -Force -LiteralPath $LocalArchive -Destination $Archive
            } else {
              Invoke-WebRequest -Uri $System.url -OutFile $Archive
            }
            if ((Get-Item -LiteralPath $Archive).Length -ne $System.size) {
              throw "Size mismatch for $($Tool.id)"
            }
            $Hash = (Get-FileHash -LiteralPath $Archive -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($Hash -ne $System.sha256) { throw "SHA-256 mismatch for $($Tool.id)" }

            $Destination = Join-Path $Extract $Tool.id
            New-Item -ItemType Directory -Force -Path $Destination | Out-Null
            if ($Archive.EndsWith('.zip')) {
              Expand-Archive -LiteralPath $Archive -DestinationPath $Destination
            } else {
              tar -xjf $Archive -C $Destination
              if ($LASTEXITCODE -ne 0) { throw "Extraction failed for $($Tool.id)" }
            }

            $Source = Join-Path $Destination $System.archiveRoot
            $Target = Join-Path $Data "packages/arduino-stc51/tools/$($Tool.packageName)/$($Tool.version)"
            New-Item -ItemType Directory -Force -Path $Target | Out-Null
            Copy-Item -Recurse -Force "$Source/*" -Destination $Target
          }

          New-Item -ItemType Directory -Force -Path (Join-Path $Work 'user/Blink') | Out-Null
          Copy-Item -Force (Join-Path $Platform 'examples/Blink/Blink.ino') -Destination (Join-Path $Work 'user/Blink/Blink.ino')

          $DataConfig = $Data.Replace('\','/')
          $DownloadDir = (Join-Path $Work 'arduino-downloads').Replace('\','/')
          $User = (Join-Path $Work 'user').Replace('\','/')
          @"
          directories:
            data: $DataConfig
            downloads: $DownloadDir
            user: $User
          "@ | Set-Content -Encoding UTF8 (Join-Path $Work 'arduino-cli.yaml')

          "STC_CI_WORK=$Work" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Compile every variant and AI dual mode
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Config = Join-Path $env:STC_CI_WORK 'arduino-cli.yaml'
          $Sketch = Join-Path $env:STC_CI_WORK 'user/Blink'

          $Devices = (Get-Content -Raw -Encoding UTF8 tools/variants/devices.json | ConvertFrom-Json).devices
          foreach ($Device in $Devices) {
            $Build = Join-Path $env:STC_CI_WORK "build/$($Device.id)"
            arduino-cli compile --clean --fqbn "arduino-stc51:mcs51:$($Device.id)" --build-path $Build --config-file $Config $Sketch
            if ($LASTEXITCODE -ne 0) { throw "Compile failed: $($Device.model)" }
            $HexFiles = @(Get-ChildItem -LiteralPath $Build -Filter '*.hex')
            if ($HexFiles.Count -ne 1) { throw "Expected one HEX: $($Device.model)" }
            if ($Device.target -eq 'mcs251' -and $Device.family.StartsWith('STC32')) {
              $MapFiles = @(Get-ChildItem -LiteralPath $Build -Filter '*.map')
              if ($MapFiles.Count -ne 1) { throw "Expected one map: $($Device.model)" }
              [uint32]$FlashFloor = if ($null -ne $Device.linker.flash_loc) {
                $Device.linker.flash_loc
              } else { 0x1000000 - [uint32]$Device.flash_bytes }
              [uint32]$FlashCeiling = $FlashFloor + [uint32]$Device.flash_bytes - 1
              [uint32]$CodeFloor = if ($null -ne $Device.linker.gsinit0_loc) {
                $Device.linker.gsinit0_loc
              } else { $Device.linker.code_loc }
              & ./scripts/verify-mcs251-image.ps1 -HexPath $HexFiles[0].FullName `
                -MapPath $MapFiles[0].FullName -Layout ([string]$Device.linker.layout) `
                -FlashFloor $FlashFloor -FlashCeiling $FlashCeiling `
                -HomeAddress ([uint32]$Device.linker.code_loc) `
                -CodeFloor $CodeFloor -MaximumCodeBytes ([uint32]$Device.maximum_code_bytes) `
                -Model ([string]$Device.model)
            }
            if ($Device.id -eq 'stc32g144k246') {
              & ./scripts/verify-stc32g144k246-image.ps1 -HexPath $HexFiles[0].FullName `
                -HomeAddress ([uint32]$Device.linker.code_loc) `
                -CodeFloor ([uint32]$Device.linker.gsinit0_loc)
              node ./scripts/check-mcs251-isr-context.mjs --build-dir $Build
              if ($LASTEXITCODE -ne 0) { throw 'MCS251 ISR context check failed' }
            }
          }

          foreach ($DualDevice in @($Devices | Where-Object {
            $_.target -eq 'dual' -and 'mcs251' -in @($_.experimental_targets)
          })) {
            $DualBuild = Join-Path $env:STC_CI_WORK "build/$($DualDevice.id)-mcs251"
            arduino-cli compile --clean --fqbn "arduino-stc51:mcs51:$($DualDevice.id):execution=mcs251" --build-path $DualBuild --config-file $Config $Sketch
            if ($LASTEXITCODE -ne 0) { throw "$($DualDevice.model) MCS251 compile failed" }
            $DualHexFiles = @(Get-ChildItem -LiteralPath $DualBuild -Filter '*.hex')
            $DualMapFiles = @(Get-ChildItem -LiteralPath $DualBuild -Filter '*.map')
            if ($DualHexFiles.Count -ne 1 -or $DualMapFiles.Count -ne 1) {
              throw "$($DualDevice.model) MCS251 expected one HEX/map; got HEX=$($DualHexFiles.Count), map=$($DualMapFiles.Count)"
            }
            $DualLinker = $DualDevice.mcs251_linker
            if ($null -eq $DualLinker) { throw "$($DualDevice.model) lacks its MCS251 linker layout" }
            [uint32]$FlashFloor = if ($null -ne $DualLinker.flash_loc) {
              $DualLinker.flash_loc
            } else { 0x1000000 - [uint32]$DualDevice.flash_bytes }
            [uint32]$FlashCeiling = $FlashFloor + [uint32]$DualDevice.flash_bytes - 1
            [uint32]$CodeFloor = if ($null -ne $DualLinker.gsinit0_loc) {
              $DualLinker.gsinit0_loc
            } else { $DualLinker.code_loc }
            & ./scripts/verify-mcs251-image.ps1 -HexPath $DualHexFiles[0].FullName `
              -MapPath $DualMapFiles[0].FullName -Layout ([string]$DualLinker.layout) `
              -FlashFloor $FlashFloor -FlashCeiling $FlashCeiling `
              -HomeAddress ([uint32]$DualLinker.code_loc) `
              -CodeFloor $CodeFloor `
              -MaximumCodeBytes ([uint32]$DualDevice.maximum_code_bytes) `
              -Model ([string]$DualDevice.model)
          }

          $PlatformRoot = Join-Path $env:STC_CI_WORK 'data/packages/arduino-stc51/hardware/mcs51/0.0.2'
          foreach ($LibraryProbe in @(
            @{ name = 'Wire'; board = 'stc8h8k64u'; example = 'MasterRegisterRead' },
            @{ name = 'SPI'; board = 'stc8g1k08a'; example = 'SoftwareLoopback' },
            @{ name = 'SoftwareSerial'; board = 'stc8h1k08'; example = 'PollingEcho' },
            @{ name = 'LiquidCrystal'; board = 'stc8h8k64u'; example = 'HelloWorld' },
            @{ name = 'Stepper'; board = 'stc8h8k64u'; example = 'OneRevolution' },
            @{ name = 'SD'; board = 'stc8h8k64u'; example = 'ReadFile' },
            @{ name = 'SD'; board = 'stc32g12k128'; example = 'ReadFile' }
          )) {
            $Build = Join-Path $env:STC_CI_WORK "build/library-$($LibraryProbe.name.ToLowerInvariant())-$($LibraryProbe.board)"
            $Example = Join-Path $PlatformRoot "libraries/$($LibraryProbe.name)/examples/$($LibraryProbe.example)"
            arduino-cli compile --clean --fqbn "arduino-stc51:mcs51:$($LibraryProbe.board)" `
              --build-path $Build --config-file $Config $Example
            if ($LASTEXITCODE -ne 0) { throw "$($LibraryProbe.name) example failed" }
          }

          arduino-cli compile --clean --fqbn 'arduino-stc51:mcs51:stc32g12k128' `
            --build-path (Join-Path $env:STC_CI_WORK 'build/software-serial-mcs251') --config-file $Config `
            (Join-Path $PlatformRoot 'libraries/SoftwareSerial/examples/PollingEcho')
          if ($LASTEXITCODE -ne 0) { throw 'SoftwareSerial MCS251 example failed' }

          # A second build in a new directory exercises Arduino's cached core.a path.
          $CacheBuild = Join-Path $env:STC_CI_WORK 'build/stc8h8k64u-cache-hit'
          arduino-cli compile --fqbn 'arduino-stc51:mcs51:stc8h8k64u' --build-path $CacheBuild --config-file $Config $Sketch
          if ($LASTEXITCODE -ne 0) { throw 'Cached core archive link failed' }

          $Dirty = @(git status --porcelain)
          if ($Dirty.Count -ne 0) { throw "Build polluted the repository:`n$($Dirty -join "`n")" }

  verify-release:
    needs: [validate-and-compile, compile-posix]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: arduino-stc51-platform-0.0.2
          path: ci-platform
      - name: Verify published release and reproduced platform
        env:
          GH_TOKEN: ${{ github.token }}
          STC_TAG: ${{ github.ref_name }}
        run: |
          test "$STC_TAG" = "v$(python3 -c 'import json; print(json.load(open("release-manifest.json"))["version"])')"
          gh release download "$STC_TAG" --dir published
          python3 scripts/verify-release-assets.py release-manifest.json published \
            --platform-archive ci-platform/arduino-stc51-0.0.2.tar.bz2

  compile-posix:
    needs: validate-and-compile
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            host: x86_64-pc-linux-gnu
            file_arch: x86-64
          - os: macos-15
            host: arm64-apple-darwin
            file_arch: arm64
          - os: macos-15-intel
            host: x86_64-apple-darwin
            file_arch: x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download verified platform package
        uses: actions/download-artifact@v4
        with:
          name: arduino-stc51-platform-0.0.2
          path: ${{ runner.temp }}/arduino-stc51-platform-package

      - uses: arduino/setup-arduino-cli@v2

      - name: Stage POSIX platform and pinned tools
        shell: pwsh
        env:
          STC_HOST: ${{ matrix.host }}
          STC_FILE_ARCH: ${{ matrix.file_arch }}
        run: |
          $ErrorActionPreference = 'Stop'
          $Work = Join-Path $env:RUNNER_TEMP 'arduino-stc51-posix-ci'
          $Data = Join-Path $Work 'data'
          $Platform = Join-Path $Data 'packages/arduino-stc51/hardware/mcs51/0.0.2'
          $Downloads = Join-Path $Work 'downloads'
          $Extract = Join-Path $Work 'extract'
          New-Item -ItemType Directory -Force -Path $Platform,$Downloads,$Extract,$Data | Out-Null

          $PlatformExtract = Join-Path $Extract 'platform'
          New-Item -ItemType Directory -Force -Path $PlatformExtract | Out-Null
          $PlatformArchive = Join-Path $env:RUNNER_TEMP `
            'arduino-stc51-platform-package/arduino-stc51-0.0.2.tar.bz2'
          tar -xjf $PlatformArchive -C $PlatformExtract
          if ($LASTEXITCODE -ne 0) { throw 'Platform archive extraction failed' }
          Copy-Item -Recurse -Force "$PlatformExtract/arduino-stc51-0.0.2/*" -Destination $Platform

          $Manifest = Get-Content -Raw -Encoding UTF8 tools/toolchain-manifest.json | ConvertFrom-Json
          foreach ($Tool in $Manifest.tools) {
            $System = @($Tool.systems | Where-Object host -eq $env:STC_HOST | Select-Object -First 1)[0]
            if ($null -eq $System -and $env:STC_HOST -eq 'arm64-apple-darwin') {
              # Arduino's documented Apple Silicon fallback for helper flavours.
              $System = @($Tool.systems | Where-Object host -eq 'x86_64-apple-darwin' | Select-Object -First 1)[0]
            }
            if ($null -eq $System) {
              if ($Tool.id -eq 'sdcc-mcs251') {
                throw "No primary compiler system for $env:STC_HOST"
              }
              Write-Host "Skipping POSIX-unused helper $($Tool.id): no $env:STC_HOST archive"
              continue
            }

            $Archive = Join-Path $Downloads $System.archiveFileName
            $LocalArchive = Join-Path $PWD "dist/$($System.archiveFileName)"
            if (Test-Path -LiteralPath $LocalArchive) {
              Copy-Item -Force $LocalArchive $Archive
            } else {
              Invoke-WebRequest -Uri $System.url -OutFile $Archive
            }
            if ((Get-Item -LiteralPath $Archive).Length -ne [long]$System.size) {
              throw "Size mismatch for $($Tool.id)"
            }
            $Hash = (Get-FileHash -LiteralPath $Archive -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($Hash -ne $System.sha256) { throw "SHA-256 mismatch for $($Tool.id)" }

            $Destination = Join-Path $Extract $Tool.id
            New-Item -ItemType Directory -Force -Path $Destination | Out-Null
            tar -xjf $Archive -C $Destination
            if ($LASTEXITCODE -ne 0) { throw "Extraction failed for $($Tool.id)" }

            $Source = Join-Path $Destination $System.archiveRoot
            $Target = Join-Path $Data "packages/arduino-stc51/tools/$($Tool.packageName)/$($Tool.version)"
            New-Item -ItemType Directory -Force -Path $Target | Out-Null
            Copy-Item -Recurse -Force "$Source/*" -Destination $Target

            if ($Tool.id -eq 'sdcc-mcs251') {
              $Compiler = Join-Path $Target 'bin/sdcc'
              $FileDescription = (& file $Compiler) -join "`n"
              if ($FileDescription -notmatch [regex]::Escape($env:STC_FILE_ARCH)) {
                throw "Wrong compiler architecture: $FileDescription"
              }
              & $Compiler --version
              if ($LASTEXITCODE -ne 0) { throw 'Packaged compiler cannot execute' }
            }
          }

          $Sketch = Join-Path $Work 'user/Blink'
          New-Item -ItemType Directory -Force -Path $Sketch | Out-Null
          Copy-Item -Force (Join-Path $Platform 'examples/Blink/Blink.ino') -Destination (Join-Path $Sketch 'Blink.ino')

          $DataConfig = $Data.Replace('\','/')
          $DownloadDir = (Join-Path $Work 'arduino-downloads').Replace('\','/')
          $User = (Join-Path $Work 'user').Replace('\','/')
          @"
          directories:
            data: $DataConfig
            downloads: $DownloadDir
            user: $User
          "@ | Set-Content -Encoding UTF8 (Join-Path $Work 'arduino-cli.yaml')

          "STC_CI_WORK=$Work" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Compile every POSIX variant, dual mode and cache
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $Config = Join-Path $env:STC_CI_WORK 'arduino-cli.yaml'
          $Sketch = Join-Path $env:STC_CI_WORK 'user/Blink'
          $Devices = (Get-Content -Raw -Encoding UTF8 tools/variants/devices.json | ConvertFrom-Json).devices

          foreach ($Device in $Devices) {
            $Build = Join-Path $env:STC_CI_WORK "build/$($Device.id)"
            arduino-cli compile --clean --fqbn "arduino-stc51:mcs51:$($Device.id)" --build-path $Build --config-file $Config $Sketch
            if ($LASTEXITCODE -ne 0) { throw "Compile failed: $($Device.model)" }
            $HexFiles = @(Get-ChildItem -LiteralPath $Build -Filter '*.hex')
            if ($HexFiles.Count -ne 1) { throw "Expected one HEX: $($Device.model)" }
            if ($Device.target -eq 'mcs251' -and $Device.family.StartsWith('STC32')) {
              $MapFiles = @(Get-ChildItem -LiteralPath $Build -Filter '*.map')
              if ($MapFiles.Count -ne 1) { throw "Expected one map: $($Device.model)" }
              [uint32]$FlashFloor = if ($null -ne $Device.linker.flash_loc) {
                $Device.linker.flash_loc
              } else { 0x1000000 - [uint32]$Device.flash_bytes }
              [uint32]$FlashCeiling = $FlashFloor + [uint32]$Device.flash_bytes - 1
              [uint32]$CodeFloor = if ($null -ne $Device.linker.gsinit0_loc) {
                $Device.linker.gsinit0_loc
              } else { $Device.linker.code_loc }
              & ./scripts/verify-mcs251-image.ps1 -HexPath $HexFiles[0].FullName `
                -MapPath $MapFiles[0].FullName -Layout ([string]$Device.linker.layout) `
                -FlashFloor $FlashFloor -FlashCeiling $FlashCeiling `
                -HomeAddress ([uint32]$Device.linker.code_loc) `
                -CodeFloor $CodeFloor -MaximumCodeBytes ([uint32]$Device.maximum_code_bytes) `
                -Model ([string]$Device.model)
            }
            if ($Device.id -eq 'stc32g144k246') {
              & ./scripts/verify-stc32g144k246-image.ps1 -HexPath $HexFiles[0].FullName `
                -HomeAddress ([uint32]$Device.linker.code_loc) `
                -CodeFloor ([uint32]$Device.linker.gsinit0_loc)
              node ./scripts/check-mcs251-isr-context.mjs --build-dir $Build
              if ($LASTEXITCODE -ne 0) { throw 'MCS251 ISR context check failed' }
            }
          }

          foreach ($DualDevice in @($Devices | Where-Object {
            $_.target -eq 'dual' -and 'mcs251' -in @($_.experimental_targets)
          })) {
            $DualBuild = Join-Path $env:STC_CI_WORK "build/$($DualDevice.id)-mcs251"
            arduino-cli compile --clean --fqbn "arduino-stc51:mcs51:$($DualDevice.id):execution=mcs251" --build-path $DualBuild --config-file $Config $Sketch
            if ($LASTEXITCODE -ne 0) { throw "$($DualDevice.model) MCS251 compile failed" }
            $DualHexFiles = @(Get-ChildItem -LiteralPath $DualBuild -Filter '*.hex')
            $DualMapFiles = @(Get-ChildItem -LiteralPath $DualBuild -Filter '*.map')
            if ($DualHexFiles.Count -ne 1 -or $DualMapFiles.Count -ne 1) {
              throw "$($DualDevice.model) MCS251 expected one HEX/map; got HEX=$($DualHexFiles.Count), map=$($DualMapFiles.Count)"
            }
            $DualLinker = $DualDevice.mcs251_linker
            if ($null -eq $DualLinker) { throw "$($DualDevice.model) lacks its MCS251 linker layout" }
            [uint32]$FlashFloor = if ($null -ne $DualLinker.flash_loc) {
              $DualLinker.flash_loc
            } else { 0x1000000 - [uint32]$DualDevice.flash_bytes }
            [uint32]$FlashCeiling = $FlashFloor + [uint32]$DualDevice.flash_bytes - 1
            [uint32]$CodeFloor = if ($null -ne $DualLinker.gsinit0_loc) {
              $DualLinker.gsinit0_loc
            } else { $DualLinker.code_loc }
            & ./scripts/verify-mcs251-image.ps1 -HexPath $DualHexFiles[0].FullName `
              -MapPath $DualMapFiles[0].FullName -Layout ([string]$DualLinker.layout) `
              -FlashFloor $FlashFloor -FlashCeiling $FlashCeiling `
              -HomeAddress ([uint32]$DualLinker.code_loc) `
              -CodeFloor $CodeFloor `
              -MaximumCodeBytes ([uint32]$DualDevice.maximum_code_bytes) `
              -Model ([string]$DualDevice.model)
          }

          $PlatformRoot = Join-Path $env:STC_CI_WORK 'data/packages/arduino-stc51/hardware/mcs51/0.0.2'
          foreach ($LibraryProbe in @(
            @{ name = 'Wire'; board = 'stc8h8k64u'; example = 'MasterRegisterRead' },
            @{ name = 'SPI'; board = 'stc8g1k08a'; example = 'SoftwareLoopback' },
            @{ name = 'SoftwareSerial'; board = 'stc8h1k08'; example = 'PollingEcho' },
            @{ name = 'LiquidCrystal'; board = 'stc8h8k64u'; example = 'HelloWorld' },
            @{ name = 'Stepper'; board = 'stc8h8k64u'; example = 'OneRevolution' },
            @{ name = 'SD'; board = 'stc8h8k64u'; example = 'ReadFile' },
            @{ name = 'SD'; board = 'stc32g12k128'; example = 'ReadFile' }
          )) {
            $Build = Join-Path $env:STC_CI_WORK "build/library-$($LibraryProbe.name.ToLowerInvariant())-$($LibraryProbe.board)"
            $Example = Join-Path $PlatformRoot "libraries/$($LibraryProbe.name)/examples/$($LibraryProbe.example)"
            arduino-cli compile --clean --fqbn "arduino-stc51:mcs51:$($LibraryProbe.board)" `
              --build-path $Build --config-file $Config $Example
            if ($LASTEXITCODE -ne 0) { throw "$($LibraryProbe.name) example failed" }
          }

          arduino-cli compile --clean --fqbn 'arduino-stc51:mcs51:stc32g12k128' `
            --build-path (Join-Path $env:STC_CI_WORK 'build/software-serial-mcs251') --config-file $Config `
            (Join-Path $PlatformRoot 'libraries/SoftwareSerial/examples/PollingEcho')
          if ($LASTEXITCODE -ne 0) { throw 'SoftwareSerial MCS251 example failed' }

          $CacheBuild = Join-Path $env:STC_CI_WORK 'build/stc8h8k64u-cache-hit'
          arduino-cli compile --fqbn 'arduino-stc51:mcs51:stc8h8k64u' --build-path $CacheBuild --config-file $Config $Sketch
          if ($LASTEXITCODE -ne 0) { throw 'Cached core archive link failed' }

          $Dirty = @(git status --porcelain)
          if ($Dirty.Count -ne 0) { throw "Build polluted the repository:`n$($Dirty -join "`n")" }
